# Local checks that mirror the CI. Install once per clone:
#   pip install pre-commit
#   pre-commit install --install-hooks
#   pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # black and pylint run from the Poetry environment so they use the same
  # versions the CI installs, instead of a second copy pinned here.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
        require_serial: true
      - id: pylint
        name: pylint
        entry: poetry run pylint src/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
