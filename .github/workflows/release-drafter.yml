name: Release Drafter

# Release Drafter reads .github/release-drafter.yml from the default branch, so
# it only runs once a change lands on main. Running it on pull requests would
# fail until the config file reaches main. PR labels come from pr-labeler.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # publish: true creates the tag and publishes the release on every push to
      # main. Each develop -> main promotion is one release, with the version
      # resolved from the PR labels (see release-drafter.yml).
      - name: Draft and publish the release
        uses: release-drafter/release-drafter@v7
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
