name: PR Title

# The title is what the release notes show, so it follows Conventional Commits:
#   type(optional scope): lowercase description
# Runs on pull_request_target because it only reads the title and never checks
# out the PR code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description "{subject}" must start with a lowercase letter.
            Example: "feat(alerts): add a window for medium priority".
