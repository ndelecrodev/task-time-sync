name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- Sem mudanças nesta versão."

template: |
  ## O que mudou

  $CHANGES

  **Comparação completa:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "Novidades"
    labels: [feature, enhancement]
  - title: "Correções"
    labels: [fix, bug]
  - title: "Refatoração"
    labels: [refactor]
  - title: "Documentação"
    labels: [documentation]
  - title: "Testes"
    labels: [test]
  - title: "Infra e dependências"
    labels: [chore, dependencies, ci]

exclude-labels:
  - skip-changelog

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, refactor, documentation, test, chore, dependencies, ci]
  default: patch
